AWSTemplateFormatVersion: '2010-09-09'
Description: Private I CONFESS media bucket and signed CloudFront delivery
Parameters:
  PublicKeyPem:
    Type: String
    NoEcho: true
    Description: PEM encoded CloudFront public key; retain the private key outside CloudFormation.
Resources:
  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      VersioningConfiguration: { Status: Enabled }
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-media-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  SigningPublicKey:
    Type: AWS::CloudFront::PublicKey
    Properties:
      PublicKeyConfig:
        CallerReference: !Ref AWS::StackId
        EncodedKey: !Ref PublicKeyPem
        Name: !Sub '${AWS::StackName}-media-key'
  SigningKeyGroup:
    Type: AWS::CloudFront::KeyGroup
    Properties:
      KeyGroupConfig:
        Items: [!Ref SigningPublicKey]
        Name: !Sub '${AWS::StackName}-media-keys'
  PrivateMediaHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-private-media'
        CustomHeadersConfig:
          Items:
            - Header: Cache-Control
              Value: 'private, no-store'
              Override: true  # Also replace public/immutable headers on legacy objects.
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        Origins:
          - Id: private-media
            DomainName: !GetAtt MediaBucket.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig: { OriginAccessIdentity: '' }
        # First match wins. These paths match storage.noStoreMedia. Keep both
        # controls: Managed-CachingDisabled (edge TTLs all zero) and the
        # response policy for browsers/downstream caches. Neither grants access.
        CacheBehaviors:
          - PathPattern: 'audio/voices/*'
            TargetOriginId: private-media
            ViewerProtocolPolicy: https-only
            TrustedKeyGroups: [!Ref SigningKeyGroup]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            ResponseHeadersPolicyId: !Ref PrivateMediaHeaders
            AllowedMethods: [GET, HEAD, OPTIONS]
          - PathPattern: 'voice-private/*'
            TargetOriginId: private-media
            ViewerProtocolPolicy: https-only
            TrustedKeyGroups: [!Ref SigningKeyGroup]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            ResponseHeadersPolicyId: !Ref PrivateMediaHeaders
            AllowedMethods: [GET, HEAD, OPTIONS]
          - PathPattern: 'bible/*'
            TargetOriginId: private-media
            ViewerProtocolPolicy: https-only
            TrustedKeyGroups: [!Ref SigningKeyGroup]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            ResponseHeadersPolicyId: !Ref PrivateMediaHeaders
            AllowedMethods: [GET, HEAD, OPTIONS]
        DefaultCacheBehavior:
          TargetOriginId: private-media
          ViewerProtocolPolicy: redirect-to-https
          TrustedKeyGroups: [!Ref SigningKeyGroup]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${MediaBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
Outputs:
  BucketName: { Value: !Ref MediaBucket }
  BucketRegionalDomain: { Value: !GetAtt MediaBucket.RegionalDomainName }
  DistributionId: { Value: !Ref Distribution }
  DistributionDomain: { Value: !GetAtt Distribution.DomainName }
  KeyPairId: { Value: !Ref SigningPublicKey }
