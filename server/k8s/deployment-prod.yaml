---
apiVersion: v1
kind: Namespace
metadata:
  name: iconfess-prod

---
apiVersion: v1
kind: Secret
metadata:
  name: iconfess-secrets
  namespace: iconfess-prod
type: Opaque
stringData:
  jwt-secret: "CHANGE_ME_PRODUCTION_SECRET"
  postgres-password: "CHANGE_ME_POSTGRES_PASSWORD"
  redis-password: "CHANGE_ME_REDIS_PASSWORD"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: iconfess-config
  namespace: iconfess-prod
data:
  PORT: "8080"
  ENV: "production"
  LOG_LEVEL: "warn"
  QUEUE_WORKERS: "16"
  TOKEN_TTL: "4h"
  # GPU spend (audit VE-017). A batch is refused *before* any job is queued when
  # its estimated inference time exceeds this ceiling. 0 disables the per-batch
  # ceiling; that is a decision to make loudly, not by omission.
  VOICE_BATCH_GPU_BUDGET_SECONDS: "3600"
  # Ceiling for the whole UTC day across every voice. 0 means unlimited, which
  # is the stance until the daily GPU allocation is agreed.
  VOICE_GPU_DAILY_BUDGET_SECONDS: "0"
  # USD per GPU-second as measured by the worker. Deliberately unset: no price
  # means seconds are reported and dollars are not, whereas 0 would assert in
  # every metric and report that this compute is free. Set it once the A100 rate
  # is agreed and dollars appear without touching the worker.
  # VOICE_GPU_SECOND_COST_USD: "0.00079"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iconfess-backend
  namespace: iconfess-prod
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: iconfess-backend
  template:
    metadata:
      labels:
        app: iconfess-backend
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - iconfess-backend
                topologyKey: kubernetes.io/hostname
      containers:
        - name: backend
          image: ghcr.io/teamthy/i-confess:IMAGE_DIGEST_REQUIRED
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: iconfess-config
          env:
            - name: POSTGRES_DSN
              value: "postgres://iconfess:$(POSTGRES_PASSWORD)@postgres.iconfess-prod.svc.cluster.local:5432/iconfess?sslmode=require"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: iconfess-secrets
                  key: postgres-password
            - name: REDIS_ADDR
              value: "redis.iconfess-prod.svc.cluster.local:6379"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: iconfess-secrets
                  key: jwt-secret
            - name: SENTRY_DSN
              value: "https://CHANGE_ME@sentry.io/PROJECT_ID"
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: iconfess-backend
  namespace: iconfess-prod
spec:
  selector:
    app: iconfess-backend
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: iconfess-backend-hpa
  namespace: iconfess-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: iconfess-backend
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: iconfess-backend-pdb
  namespace: iconfess-prod
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: iconfess-backend

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: iconfess-backend-policy
  namespace: iconfess-prod
spec:
  podSelector:
    matchLabels:
      app: iconfess-backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    # The GPU voice worker. Without this the API cannot reach synthesis at all:
    # the worker's own NetworkPolicy admits the API on 8601, but egress is
    # denied here by default, so both sides of the pair have to agree. A
    # podSelector with no namespaceSelector matches this namespace only.
    - to:
        - podSelector:
            matchLabels:
              app: iconfess-voice-engine
      ports:
        - protocol: TCP
          port: 8601
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
