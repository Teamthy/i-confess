apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: iconfess-migrate
spec:
  podSelector:
    matchLabels:
      app: iconfess-migrate
  policyTypes: [Ingress, Egress]
  ingress: []
  # The repository's in-namespace PostgreSQL topology. Managed databases need
  # a separately approved egress policy; do not grant general internet access.
  egress:
    - to:
        - podSelector:
            matchLabels: {app: postgres}
      ports:
        - {protocol: TCP, port: 5432}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
