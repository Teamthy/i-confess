name: Temporary generated API artifact export

on:
  push:
    branches: [arena/01a0edb0-i-confess]

permissions:
  contents: write

jobs:
  export:
    name: Export Go API artifacts
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: iconfess
          POSTGRES_PASSWORD: iconfess
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.25.x
          cache: true
          cache-dependency-path: server/go.sum
      - name: Generate route and OpenAPI artifacts
        working-directory: server
        env:
          DATABASE_URL: host=127.0.0.1 port=5432 user=iconfess password=iconfess dbname=postgres sslmode=disable
          TEST_DATABASE_URL: host=127.0.0.1 port=5432 user=iconfess password=iconfess dbname=postgres sslmode=disable
          EXPORT_ROUTES: "1"
          EXPORT_ROUTES_PATH: ../design/routes.json
        run: |
          go run ./cmd/genspec ../contracts/openapi.json
          go test ./internal/api -run '^TestExportRouteTable$' -count=1
      - name: Diagnose Go API test failures
        working-directory: server
        env:
          TEST_DATABASE_URL: host=127.0.0.1 port=5432 user=iconfess password=iconfess dbname=postgres sslmode=disable
          REDIS_ADDR: 127.0.0.1:6379
        run: |
          set +e
          go test -race -json -count=1 ./internal/api > /tmp/api-test.json
          status=$?
          set -e
          python3 - <<'PY'
          import json
          from pathlib import Path

          events = [json.loads(line) for line in Path('/tmp/api-test.json').read_text().splitlines() if line.strip()]
          failed = {e.get('Test') for e in events if e.get('Action') == 'fail' and e.get('Test')}
          for name in sorted(failed):
              print(f'FAILED_TEST {name}')
          for event in events:
              if event.get('Action') == 'fail' and not event.get('Test'):
                  print('PACKAGE_FAILURE', event.get('Output', event))
              if event.get('Action') != 'output':
                  continue
              test = event.get('Test')
              output = event.get('Output', '')
              if test in failed or any(name.startswith((test or '') + '/') for name in failed):
                  print(output, end='')
              elif 'WARNING: DATA RACE' in output or '--- FAIL:' in output:
                  print(output, end='')
          PY
          exit "$status"
      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: api-generated-artifacts
          path: |
            design/routes.json
            contracts/openapi.json
          if-no-files-found: error
      - name: Commit generated artifacts to the session branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design/routes.json contracts/openapi.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(api): regenerate Go route and OpenAPI artifacts"
          git push origin "HEAD:${BRANCH}"
