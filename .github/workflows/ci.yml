name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build, vet & test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.25.x"]

    # The Go module lives in server/, not at the repository root. Every run step
    # therefore has to execute there; without this, `go mod verify` fails in
    # seconds with "go.mod file not found" and CI reports a failure that says
    # nothing about the code. setup-go also needs to be told where go.sum is,
    # otherwise dependency caching silently does nothing.
    defaults:
      run:
        working-directory: server

    # The suite runs against PostgreSQL, not a stand-in. Tests call dbtest.New,
    # which fails rather than skips when TEST_DATABASE_URL is unset, so a green
    # run always means a real database was exercised.
    env:
      TEST_DATABASE_URL: host=127.0.0.1 port=5432 user=iconfess password=iconfess dbname=postgres sslmode=disable
      # Cross-instance cache invalidation is Redis pub/sub. Without a server,
      # internal/cache's live-Redis assertions skip - loudly, but they skip -
      # and a green run would then say nothing about the transport that
      # production depends on. The service below is what makes them run.
      REDIS_ADDR: 127.0.0.1:6379

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: iconfess
          POSTGRES_PASSWORD: iconfess
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history. Lint fails only on findings introduced by the branch
          # (`new-from-merge-base: main` in .golangci.yml), which requires the
          # merge base to be resolvable. The default shallow clone cannot name
          # it, so golangci-lint silently reports the whole pre-existing debt —
          # the exact red-for-64-findings outcome the setting exists to avoid.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: server/go.sum

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # -race is deliberate: the session engine and the idempotency middleware
      # are concurrent by nature, and a data race there corrupts playback state
      # in ways no unit test will reproduce on demand.
      - name: Test
        run: go test -race ./...

      # Lint runs before the tests so a style or correctness finding is
      # reported in seconds rather than after the database suite. It uses
      # new-from-merge-base, so only findings introduced by the branch fail the
      # build; the pre-existing debt is tracked in docs/PROJECT-STATUS.md.
      #
      # The design scripts live at the repository root and resolve their inputs
      # relative to the working directory, so this step overrides the job-level
      # `working-directory: server`. Without the override it failed on every
      # branch with "can't open file server/design/generate.py" while the real
      # checks were never executed — a red build that proved nothing (PRs 24
      # through 31 all merged with this step failing).
      - name: Design tokens
        working-directory: .
        run: |
          python3 design/generate.py --check
          python3 design/test_design.py
          python3 design/test_ia.py

      # Catches the cheap class of Dart mistake — a model field, endpoint,
      # provider or token that does not exist — without needing an SDK, so it
      # fails here in seconds rather than in the Flutter job minutes later.
      # It does not replace `flutter analyze`; both run.
      - name: Dart symbols
        working-directory: .
        run: python3 scripts/check_dart_symbols.py

      # new-from-merge-base: main needs a ref literally named `main`. The PR
      # checkout is a detached merge ref, so create it before lint runs;
      # otherwise golangci cannot resolve the base and reports findings on
      # lines the branch never touched as if they were new. On push runs the
      # local branch already exists (it IS the checkout), so only create it
      # when missing.
      - name: Resolve lint merge base
        run: git rev-parse --verify --quiet main >/dev/null || git branch main origin/main

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13
          working-directory: server

      - name: gofmt check
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$files"
            exit 1
          fi

      # VE-018: reachable-vulnerability scanning for the Go module graph.
      #
      # Advisory, not blocking, and that is deliberate: govulncheck's first run
      # against a dependency set this size will report something, and a red main
      # on an unreviewed report teaches people to ignore it. Triage the first
      # report, then remove continue-on-error so this becomes the gate the
      # production checklist asks for. It reports only vulnerabilities reachable
      # from this code, so the list should be short.
      - name: Vulnerability scan (govulncheck, advisory)
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...


  # The Dart and Flutter clients have no job here before this change, and their
  # fifteen test files had never been executed by anything - not CI, not a
  # release, not the audit beyond reading them. Adding the jobs is what makes
  # "the tests pass" mean something for the mobile app.
  #
  # These run on GitHub's runners because pub.dev is unreachable from the
  # development sandbox: dependencies can be resolved here and nowhere else, so
  # this job IS the verification for anything under apps/ and clients/.
  mobile:
    name: Flutter analyze & test (apps/mobile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        id: dependencies
        run: ../../scripts/ci-check.sh flutter pub get

      # --no-fatal-infos on purpose. Lint infos are style, and this package has
      # never been analyzed in CI; failing on the pre-existing ones would make
      # the job red for reasons that have nothing to do with the change under
      # review. Errors and warnings still fail it, which is where the real
      # findings live - a missing import compiles nowhere.
      - name: Analyze
        run: ../../scripts/ci-check.sh flutter analyze --no-fatal-infos

      - name: Test
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: ../../scripts/ci-check.sh flutter test --reporter expanded

  # The GPU worker is the component that actually synthesises minister speech,
  # and until this job existed nothing in CI executed a line of it: a regression
  # in the DSP chain, the licence gate or the wire protocol would have shipped
  # silently. These tests need no GPU, no model and no database - the dev-tone
  # engine and a temporary storage root are enough - so there is no reason for
  # them to be optional.
  voice-engine:
    name: Voice engine worker (voice-engine)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice-engine
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: voice-engine/requirements*.txt

      - name: Resolve dependencies
        id: dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # ICF_WORKER_DEV=1 lets the dev-tone engine load; ICF_ENV is deliberately
      # NOT production, so the licence gate logs rather than exits. The
      # production behaviour of that gate is asserted separately below.
      - name: Test
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        env:
          ICF_WORKER_DEV: "1"
          ICF_ENV: development
        run: ../scripts/ci-check.sh python -m pytest -q tests

      # VE-018: nothing in this repository watched the worker's dependencies.
      # numpy and scipy ship into the GPU image and are not covered by any
      # Dependabot configuration, so a known-vulnerable pin would only be found
      # by whoever happened to read an advisory. --strict fails the job on any
      # known vulnerability rather than printing a report nobody acts on.
      # Verified against the shipped requirements: no known vulnerabilities.
      - name: Dependency vulnerability scan (pip-audit)
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --strict

      # The licence register is what stops an uncleared model reaching
      # production, so a malformed or silently-weakened register is a release
      # blocker rather than a warning. This checks structure, that every
      # production_allowed=true entry carries the checkpoint evidence the
      # register's own header demands, and that the runtime gate still refuses
      # an uncleared engine when ICF_ENV=production.
      - name: Licence register integrity
        run: python ../scripts/check_model_licenses.py --strict

      - name: Licence gate refuses uncleared engines in production
        env:
          ICF_ENV: production
        run: python ../scripts/check_model_licenses.py --gate

  deployment:
    name: Container and deployment checks
    runs-on: ubuntu-latest
    # TEMPORARY: needed only by the trivy reporting step below. Remove with it.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        run: docker build --tag iconfess:ci server
      - name: Assert non-root runtime
        run: test "$(docker image inspect iconfess:ci --format '{{.Config.User}}')" = "10001:10001"
      - name: Validate Kubernetes manifests
        run: |
          docker run --rm -v "$PWD:/work" ghcr.io/yannh/kubeconform:latest -strict -summary /work/server/k8s/deployment-prod.yaml
      - name: Lint CloudFormation
        uses: scottbrenner/cfn-lint-action@v2
        with:
          command: cfn-lint infrastructure/media-cloudfront.yaml
      - name: Scan filesystem
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'

      # TEMPORARY diagnostics step. The Actions log cannot be read from the
      # development sandbox, so the findings are posted where they can be:
      # a PR comment. Remove this step and the job-level permissions block
      # above once the scan is green.
      - name: Trivy findings, non-failing (temporary)
        if: failure()
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          format: table
          output: trivy-findings.txt
          exit-code: '0'

      - name: Report trivy findings (temporary)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '### trivy fs — CRITICAL,HIGH'
            echo '```'
            head -c 5500 trivy-findings.txt
            echo '```'
          } > /tmp/trivy.md
          gh pr comment "$PR_NUM" --body-file /tmp/trivy.md || echo "could not post comment"

  web:
    name: Typecheck & build (web)
    runs-on: ubuntu-latest
    # The web app was never built in CI while two Next.js projects existed and
    # neither was authoritative. There is one now, it serves the public site,
    # the authenticated app and the admin console, and a broken build there is
    # a broken product - so it is compiled on every run like everything else.
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        id: dependencies
        run: ../scripts/ci-check.sh npm ci

      - name: Typecheck
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: ../scripts/ci-check.sh npm run typecheck

      - name: Build
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: ../scripts/ci-check.sh npm run build

  dart-client:
    name: Dart test (clients/dart)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/dart
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Resolve dependencies
        id: dependencies
        run: ../../scripts/ci-check.sh dart pub get

      - name: Analyze
        run: ../../scripts/ci-check.sh dart analyze

      - name: Test
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: ../../scripts/ci-check.sh dart test --reporter expanded
