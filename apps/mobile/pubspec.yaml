name: iconfess
description: I CONFESS — a daily ritual of spoken Scripture. Audio sessions, voices, scheduling.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  crypto: ^3.0.7
  cryptography: ^2.9.0
  flutter_secure_storage: ^11.0.0
  just_audio: ^0.10.5
  just_audio_background: ^0.0.1-beta.17
  audio_session: ^0.2.2
  iconfess_api:
    path: ../../clients/dart
  characters: ^1.4.1

  # Push notifications (IC-012). firebase_messaging carries both platforms:
  # FCM on Android and, through the Firebase iOS SDK, APNs registration on iOS.
  # The backend delivers to APNs directly for iOS devices, so these packages are
  # only about obtaining and refreshing a token.
  #
  # Both need per-project configuration that is not in this repository -
  # google-services.json and GoogleService-Info.plist carry project credentials.
  # Run `flutterfire configure` before building a real app; without it the app
  # starts, warns, and runs without reminders rather than failing to launch.
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  # Foreground display on Android, where FCM does not raise a notification for a
  # message the app is already handling.
  flutter_local_notifications: ^17.0.0
  # The device identity a push token is registered against; see
  # lib/src/core/push/platform_device_details.dart for why it is not a serial.
  device_info_plus: ^13.2.0

  # Purchases. The store is where money changes hands; this app never decides
  # entitlement from it - the receipt goes to the server, which is the only
  # authority on what an account owns (see features/premium/purchase_controller.dart).
  in_app_purchase: ^3.3.1
  # StoreKit 2 JWS receipts and correct pending/cancelled callbacks.
  in_app_purchase_storekit: ^0.4.8+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

